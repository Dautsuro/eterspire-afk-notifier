name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q
      - name: Build the exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name EterspireNotifier
          --add-data "eterspire_notifier\templates;eterspire_notifier\templates"
          --add-data "eterspire_notifier\sounds;eterspire_notifier\sounds"
          run.py
      - uses: actions/upload-artifact@v4
        with:
          name: EterspireNotifier
          path: dist/EterspireNotifier.exe
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EterspireNotifier.exe
